components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    RfqId:
      name: rfqId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    TripId:
      name: tripId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    PodId:
      name: podId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ContractId:
      name: contractId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    SettlementId:
      name: settlementId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ExportId:
      name: exportId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 128 }
    PurposeScope:
      name: X-Purpose-Scope
      in: header
      required: false
      schema: { type: string, minLength: 8, maxLength: 200 }
    StepUpToken:
      name: X-Step-Up-Token
      in: header
      required: false
      schema: { type: string, maxLength: 2048 }
    AuditId:
      name: auditId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    RulePackId:
      name: rulePackId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    PolicyId:
      name: policyId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    Forbidden:
      description: Authorization, ABAC, ownership or relationship boundary failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ProblemDetails:
      type: object
      required: [type, title, status, code, detail, correlationId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string, example: AWD-403 }
        detail: { type: string }
        correlationId: { type: string }
    PlatformContext:
      type: object
      properties:
        tenantId: { type: string }
        organizationId: { type: string }
        membershipId: { type: integer }
        role: { type: string }
