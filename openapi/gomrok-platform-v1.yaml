openapi: 3.0.3
info:
  title: GomrokDotCom Shared Platform API
  version: 1.0.0-pre
  description: Server-enforced contract for the six Gomrok product surfaces.
servers:
  - url: /api
security:
  - bearerAuth: []
paths:
  /auth/refresh:
    post:
      summary: Rotate a refresh token and issue a short-lived access token
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Rotated session tokens
  /auth/change-password:
    post:
      summary: Change the current Driver or Company Y password and revoke refresh sessions
      operationId: changePassword
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 12 }
      responses:
        '200':
          description: Password changed and refresh sessions revoked
  /platform/context:
    get:
      summary: Return the authenticated membership scope
      operationId: getPlatformContext
      responses:
        '200':
          description: Tenant, organization, role and permission scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformContext'
  /platform/dashboard:
    get:
      summary: Read the tenant-scoped control-tower read model
      operationId: getPlatformDashboard
      responses:
        '200':
          description: Role-scoped cases, trips and notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
  /platform/realtime:
    get:
      summary: Open a tenant- and organization-scoped server-sent event stream
      operationId: streamPlatformEvents
      description: The stream emits safe event metadata only. Clients must reconnect with the bearer token and use the dashboard read model as source of truth; Last-Event-ID replay is not provided by the in-process MVP broker.
      responses:
        '200':
          description: Server-sent events stream
          content:
            text/event-stream:
              schema:
                type: string
        '429':
          description: Realtime connection capacity exhausted
  /platform/cases:
    post:
      summary: Create a structured cargo request
      operationId: createCargoRequest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CargoRequest'
      responses:
        '201':
          description: Draft case created
        '403':
          $ref: '#/components/responses/Forbidden'
  /platform/cases/{caseId}/publish-rfq:
    post:
      summary: Publish sealed RFQ1
      operationId: publishRfq1
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: RFQ1 opened
  /platform/cases/{caseId}/draft:
    patch:
      summary: Save an incomplete shipper wizard draft
      operationId: saveShipperDraft
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Draft and server review result
        '409':
          description: Only DRAFT cases are mutable
  /platform/cases/{caseId}/review:
    get:
      summary: Return server missing fields, conflicts, compliance blocks and RulePack version
      operationId: reviewShipperDraft
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses: { '200': { description: Server-owned wizard review } }
  /platform/cases/{caseId}/capacity-rfq:
    post:
      summary: Publish isolated RFQ2 from Company X
      operationId: publishRfq2
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: RFQ2 opened
  /platform/cases/{caseId}/accept-award:
    post:
      summary: Record Company X acceptance of a human customer award
      operationId: acceptCompanyXAward
      parameters: [{ $ref: '#/components/parameters/CaseId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Award acceptance recorded; contract remains the role-lock transition } }
  /platform/rfqs/{rfqId}:
    get:
      summary: Read only quotes allowed by sealed-book policy
      operationId: getRfq
      parameters:
        - $ref: '#/components/parameters/RfqId'
      responses:
        '200':
          description: RFQ read model
  /platform/rfqs:
    get:
      summary: List Company Y invitation-scoped RFQ2 books without competitor bids
      operationId: listCarrierRfq2
      parameters:
        - name: level
          in: query
          required: false
          schema: { type: string, enum: [RFQ2], default: RFQ2 }
      responses: { '200': { description: Invitation-scoped RFQ2 read model } }
  /platform/rfqs/{rfqId}/quotes:
    post:
      summary: Submit a sealed quote
      operationId: submitQuote
      parameters:
        - $ref: '#/components/parameters/RfqId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteInput'
      responses:
        '201':
          description: Quote accepted into the isolated quote book
  /platform/rfqs/{rfqId}/pricing:
    get:
      summary: Read Company X internal pricing for its own Market A quote
      operationId: getCompanyXQuotePricing
      parameters: [{ $ref: '#/components/parameters/RfqId' }]
      responses: { '200': { description: X-only pricing and margin read model } }
  /platform/rfqs/{rfqId}/award:
    post:
      summary: Human award with reason; direct Company X to Driver award is rejected
      operationId: awardRfq
      parameters:
        - $ref: '#/components/parameters/RfqId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AwardInput'
      responses:
        '200':
          description: Human award recorded
        '403':
          $ref: '#/components/responses/Forbidden'
  /platform/trips/{tripId}/start:
    post:
      summary: Start a trip only after readiness gates are true
      operationId: startTrip
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Trip tracking activated
  /platform/trips/{tripId}/pod:
    get:
      summary: Read submitted or accepted POD evidence in least privilege scope
      operationId: getPod
      parameters: [{ $ref: '#/components/parameters/TripId' }]
      responses: { '200': { description: POD read model } }
    post:
      summary: Submit delivery evidence for review
      operationId: submitPod
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PodEvidence'
      responses:
        '201':
          description: POD submitted, not accepted
        '424':
          description: Evidence incomplete
  /platform/pods/{podId}/accept:
    post:
      summary: Human review and accept POD
      operationId: acceptPod
      parameters:
        - $ref: '#/components/parameters/PodId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: POD accepted and settlement condition updated
  /platform/pods/{podId}/return:
    post:
      summary: Return insufficient POD evidence for completion
      operationId: returnPod
      parameters: [{ $ref: '#/components/parameters/PodId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string, minLength: 8 } }
      responses: { '200': { description: POD returned without deleting evidence } }
  /platform/pods/{podId}/risk-flag:
    post:
      summary: Append a human risk or fraud flag to POD review
      operationId: flagPodRisk
      parameters: [{ $ref: '#/components/parameters/PodId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { flagType: { type: string }, reason: { type: string, minLength: 8 } }
      responses: { '200': { description: Risk flag appended and audited } }
  /platform/contact-reveals:
    post:
      summary: Request temporary, reasoned contact reveal
      operationId: requestContactReveal
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Reveal grant created and audited
  /platform/exports:
    post:
      summary: Request a governed, scoped CRM export
      operationId: requestExport
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Second-person approval required
  /platform/cases/{caseId}:
    get:
      summary: Read a tenant-scoped case, timeline and documents
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses: { '200': { description: Case read model } }
  /platform/cases/{caseId}/contract:
    get:
      summary: Read versioned Customer-X contract without Market B ledgers
      operationId: getCustomerXContract
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses: { '200': { description: Versioned contract read model } }
  /platform/cases/{caseId}/customer-contract:
    post:
      summary: Lock the human customer-to-Company-X contract transition
      parameters: [{ $ref: '#/components/parameters/CaseId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Contract signed } }
  /platform/contracts/{contractId}/amend:
    post:
      summary: Create an amendment version without overwriting a signed contract
      operationId: amendCustomerXContract
      parameters: [{ $ref: '#/components/parameters/ContractId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { description: Amendment awaiting signature } }
  /platform/contracts/{contractId}/sign:
    post:
      summary: Sign and lock a pending customer contract version
      operationId: signCustomerXContract
      parameters: [{ $ref: '#/components/parameters/ContractId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Contract version signed and locked } }
  /platform/contracts/{contractId}/accept-x:
    post:
      summary: Accept a customer-signed Customer-X contract as Company X
      operationId: acceptCompanyXContract
      parameters: [{ $ref: '#/components/parameters/ContractId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Company X acceptance recorded without overwriting the contract version } }
  /platform/trips:
    post:
      summary: Create an operational trip after Company Y award
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { description: Trip created } }
  /platform/trips/{tripId}/accept-award:
    post:
      summary: Record Company Y acceptance of its awarded RFQ2 capacity
      operationId: acceptCompanyYAward
      parameters: [{ $ref: '#/components/parameters/TripId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Carrier award accepted; nomination remains a separate transition } }
  /platform/driver-assignments:
    post:
      summary: Introduce a driver inside Company Y coverage
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { description: Driver assignment created } }
  /platform/trips/{tripId}/nominate:
    post:
      summary: Nominate a validated driver and vehicle from Company Y
      parameters: [{ $ref: '#/components/parameters/TripId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Truck nominated } }
  /platform/trips/{tripId}/nomination:
    get:
      summary: Read the least-data driver and vehicle nomination for Company X
      operationId: getTripNomination
      parameters: [{ $ref: '#/components/parameters/TripId' }]
      responses: { '200': { description: Validated carrier coverage and nomination read model for X or the awarded Y } }
  /platform/carrier/network:
    get:
      summary: Read Company Y owned drivers, coverage records and vehicles
      operationId: getCarrierNetwork
      responses: { '200': { description: Y-scoped DriverCarrierCoverage and vehicle read model } }
  /platform/vehicles:
    post:
      summary: Create a Company Y owned vehicle or trailer record
      operationId: createCarrierVehicle
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleInput' }
      responses: { '201': { description: Vehicle registry record created } }
  /platform/vehicles/{vehicleId}:
    patch:
      summary: Update a Company Y owned vehicle record
      operationId: updateCarrierVehicle
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleInput' }
      responses: { '200': { description: Vehicle registry record updated } }
  /platform/trips/{tripId}/agent:
    post:
      summary: Assign an authorized Agent/Z or consignee
      parameters: [{ $ref: '#/components/parameters/TripId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentAssignmentInput' }
      responses: { '201': { description: Authorized recipient assignment created } }
  /platform/trips/{tripId}/readiness:
    post:
      summary: Update server-verified customs, permit, document and check-in gates
      parameters: [{ $ref: '#/components/parameters/TripId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Readiness updated } }
  /platform/trips/{tripId}/loading-schedule:
    get:
      summary: Read versioned loading schedules
      operationId: getLoadingSchedules
      parameters: [{ $ref: '#/components/parameters/TripId' }]
      responses: { '200': { description: Immutable loading schedule history } }
    post:
      summary: Create a new loading schedule version
      operationId: createLoadingSchedule
      parameters: [{ $ref: '#/components/parameters/TripId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoadingScheduleInput' }
      responses: { '201': { description: Loading schedule version created } }
  /platform/trips/{tripId}/loading-evidence:
    get:
      summary: Read immutable loading evidence for the selected trip
      operationId: getLoadingEvidence
      parameters: [{ $ref: '#/components/parameters/TripId' }]
      responses: { '200': { description: Loading evidence read model } }
    post:
      summary: Append an arrival, checklist, scale, seal or loading evidence record
      operationId: submitLoadingEvidence
      parameters: [{ $ref: '#/components/parameters/TripId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoadingEvidenceInput' }
      responses: { '201': { description: Immutable loading evidence accepted } }
  /platform/trips/{tripId}/status:
    post:
      summary: Advance the operational trip state through the server state graph
      parameters: [{ $ref: '#/components/parameters/TripId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: State advanced } }
  /platform/trips/{tripId}/tir:
    get:
      summary: Read the independent TIR state and Holder metadata for an authorized trip party
      operationId: getTripTir
      parameters: [{ $ref: '#/components/parameters/TripId' }]
      responses: { '200': { description: TIR Holder and discharge read model } }
    post:
      summary: Advance the independent TIR workflow with Holder authorization
      parameters: [{ $ref: '#/components/parameters/TripId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: TIR state advanced } }
  /platform/trips/{tripId}/location-events:
    post:
      summary: Append active-trip location or border evidence
      parameters: [{ $ref: '#/components/parameters/TripId' }]
      responses: { '200': { description: Location event accepted } }
  /platform/trips/{tripId}/tracking:
    get:
      summary: Read least-privilege active-trip tracking
      parameters: [{ $ref: '#/components/parameters/TripId' }]
      responses: { '200': { description: Tracking read model } }
  /platform/documents:
    post:
      summary: Create an immutable document version
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { description: Version created } }
  /platform/documents/{documentId}:
    get:
      summary: Read a document version
      parameters: [{ $ref: '#/components/parameters/DocumentId' }]
      responses: { '200': { description: Document read model } }
  /platform/documents/{documentId}/approve:
    post:
      summary: Approve and lock a document version
      parameters: [{ $ref: '#/components/parameters/DocumentId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Version locked } }
  /platform/documents/{documentId}/reject:
    post:
      summary: Return a current CMR Draft for correction with a reason
      operationId: rejectCmrDraft
      parameters: [{ $ref: '#/components/parameters/DocumentId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Draft returned; immutable history retained } }
  /platform/documents/{documentId}/download:
    get:
      summary: Issue a short-lived audited download token
      parameters: [{ $ref: '#/components/parameters/DocumentId' }]
      responses: { '200': { description: Audited download reference } }
  /platform/cases/{caseId}/cmr-draft:
    post:
      summary: Create a versioned CMR Draft for shipper review
      parameters: [{ $ref: '#/components/parameters/CaseId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { description: CMR Draft created } }
  /platform/trips/{tripId}/final-cmr:
    post:
      summary: Issue final CMR only after approved draft
      parameters: [{ $ref: '#/components/parameters/TripId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { description: Final CMR issued } }
  /platform/cases/{caseId}/contacts:
    get:
      summary: Return masked contacts or an active audited reveal
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses: { '200': { description: Masked contact read model } }
  /platform/cases/{caseId}/settlements:
    get:
      summary: Return only relationship-visible ledger rows
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses: { '200': { description: Relationship-scoped settlement read model } }
  /platform/cases/{caseId}/finance:
    get:
      summary: Read only the Customer-X relationship ledger
      operationId: getCustomerXFinance
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses: { '200': { description: Relationship-scoped finance read model } }
  /platform/settlements:
    post:
      summary: Request settlement in an explicit financial relationship
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { description: Settlement requested } }
  /platform/settlements/{settlementId}/confirm:
    post:
      summary: Confirm a Customer-X settlement after POD and import conditions
      operationId: confirmCustomerXSettlement
      parameters: [{ $ref: '#/components/parameters/SettlementId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Settlement confirmed }
        '424': { description: Settlement evidence is incomplete }
        '428': { description: Step-up authentication required }
  /platform/cases/{caseId}/claims:
    post:
      summary: Open a parallel claim case
      operationId: openClaim
      parameters: [{ $ref: '#/components/parameters/CaseId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { description: Claim opened } }
  /platform/cases/{caseId}/disputes:
    post:
      summary: Open a parallel financial or operational dispute case
      operationId: openDispute
      parameters: [{ $ref: '#/components/parameters/CaseId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { description: Dispute opened } }
  /platform/cases/{caseId}/issues:
    get:
      summary: Read claims and disputes for a case
      operationId: listCaseIssues
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses: { '200': { description: Case issue read model } }
  /platform/claims/{claimId}:
    patch:
      summary: Update a relationship-scoped claim or dispute status
      operationId: updateClaim
      parameters:
        - name: claimId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { status: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED, CLOSED] }, reason: { type: string, minLength: 8 } }
      responses: { '200': { description: Claim or dispute updated and audited } }
  /platform/claims/{claimId}/evidence:
    post:
      summary: Append immutable relationship-scoped claim evidence
      operationId: addClaimEvidence
      parameters:
        - name: claimId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { evidence: { type: object } } }
      responses: { '201': { description: Evidence appended without destructive replacement } }
  /platform/cases/{caseId}/exceptions:
    get:
      summary: Read Company X operational exceptions for a case
      operationId: listCaseExceptions
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses: { '200': { description: Exception queue read model } }
  /platform/trips/{tripId}/exceptions:
    post:
      summary: Open a human-reviewed operational exception
      operationId: openTripException
      parameters: [{ $ref: '#/components/parameters/TripId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExceptionInput' }
      responses: { '201': { description: Exception opened and audited } }
  /platform/exceptions/{exceptionId}:
    patch:
      summary: Acknowledge, resolve or close an exception
      operationId: updateException
      parameters:
        - name: exceptionId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { status: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED, CLOSED] }, reason: { type: string, minLength: 8 } }
      responses: { '200': { description: Exception status updated without deleting evidence } }
  /platform/notifications:
    get:
      summary: Read recipient-scoped domain-event notifications
      operationId: listNotifications
      responses: { '200': { description: Notification read model } }
  /platform/organization/members:
    get:
      summary: Read active members of the authenticated Company Y organization
      operationId: listCarrierOrganizationMembers
      responses: { '200': { description: Organization-scoped member list } }
  /platform/exports/{exportId}/approve:
    post:
      summary: Approve a governed export as a second person
      parameters: [{ $ref: '#/components/parameters/ExportId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Export approved } }
  /platform/exports/{exportId}/execute:
    post:
      summary: Execute an approved scoped export
      parameters: [{ $ref: '#/components/parameters/ExportId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Export executed and audited } }
  /platform/audit:
    get:
      summary: Read append-only, tenant-scoped audit events
      responses: { '200': { description: Audit read model } }
  /platform/agent/profile:
    get:
      summary: Read the authenticated Agent/Z organization KYC and security scope
      operationId: getAgentProfile
      responses: { '200': { description: Agent organization and KYC read model } }
  /platform/agent/dashboard:
    get:
      summary: Read Assignment-scoped destination deliveries and X-Agent settlement summary
      operationId: getAgentDashboard
      responses: { '200': { description: Agent/Z destination dashboard without Market A/B prices } }
  /platform/agent/deliveries:
    get:
      summary: List only valid or pending assignments for the authenticated Agent/Z organization
      operationId: listAgentDeliveries
      responses: { '200': { description: Assigned delivery queue } }
  /platform/agent/devices/bind:
    post:
      summary: Bind an Agent/Z web or mobile device before sensitive delivery actions
      operationId: bindAgentDevice
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string, minLength: 12 }
                platform: { type: string }
                appVersion: { type: string }
      responses: { '201': { description: Device binding recorded and audited } }
  /platform/agent/trips/{tripId}:
